name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download the code
        uses: actions/checkout@v5

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v5

      - name: Build the APK
        run: ./gradlew assembleDebug

      - name: Rename the APK with the version
        env:
          TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ai-job-assistant-$TAG.apk"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "ai-job-assistant-$TAG.apk" --title "$TAG" --generate-notes